; ─────────────────────────────────────────────────────────────────────────────
; extensions.conf  –  Asterisk dialplan for the call_and_record demo
;
; Context: demo
;
; Call flow:
;
;   ┌────────────┐   INVITE 101    ┌───────────┐   INVITE 101   ┌─────────────┐
;   │ sip_stack  │ ──────────────► │ Asterisk  │ ────────────►  │   Twinkle   │
;   │  ext 100   │                 │  dialplan │                 │   ext 101   │
;   └────────────┘                 └───────────┘                 └─────────────┘
;          ▲                             │
;          │       RTP (G.711)           │
;          └─────────────────────────────┘
;
; When sip_stack calls 101:
;   Asterisk rings Twinkle.  When Twinkle answers, Asterisk bridges the call.
;   sip_stack plays test.wav → Asterisk → Twinkle hears it.
;   Twinkle speaks → Asterisk → sip_stack records it to recorded.wav.
;
; Additional convenience extensions:
;   100  → echo test  (call 100 from Twinkle to test audio path)
;   199  → DTMF echo  (type digits, hear them back)
;   200  → playback demo music on hold
; ─────────────────────────────────────────────────────────────────────────────

[general]
static  = yes
writeprotect = no
autofallthrough = yes

; ─────────────────────────────────────────────────────────────────────────────
; [demo] – main context
; ─────────────────────────────────────────────────────────────────────────────
[demo]

; ── Extension 101: Twinkle softphone ─────────────────────────────────────────
; Dialled by sip_stack (extension 100) to reach Twinkle.
exten = 101,1,NoOp(Incoming call for Twinkle / ext 101 from ${CALLERID(all)})
 same  =   n,Set(CALLERID(name)=sip_stack-100)
 same  =   n,Dial(PJSIP/101,30,r)          ; ring for 30 s, pass ringback
 same  =   n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?answered:notanswered)

 same  = answered,NoOp(Call answered)
 same  =        n,Hangup()

 same  = notanswered,NoOp(Call not answered: ${DIALSTATUS})
 same  =           n,Hangup(21)            ; 21 = call rejected

; ── Extension 100: sip_stack endpoint ────────────────────────────────────────
; If Twinkle calls back to 100 (for testing), route to echo test.
exten = 100,1,NoOp(Call to sip_stack ext 100 from ${CALLERID(all)})
 same  =   n,Answer()
 same  =   n,Wait(1)
 same  =   n,Playback(demo-congrats)       ; play "congratulations" prompt
 same  =   n,Echo()                        ; echo audio back (loopback test)
 same  =   n,Hangup()

; ── Extension 199: DTMF digit echo ───────────────────────────────────────────
exten = 199,1,Answer()
 same  =   n,SayDigits(1234567890)
 same  =   n,Hangup()

; ── Extension 200: Music on hold test ────────────────────────────────────────
exten = 200,1,Answer()
 same  =   n,MusicOnHold(default,30)
 same  =   n,Hangup()

; ── i (invalid) ──────────────────────────────────────────────────────────────
exten = i,1,NoOp(Invalid extension: ${INVALID_EXTEN})
 same  =  n,Playback(pbx-invalid)
 same  =  n,Hangup()

; ── t (timeout) ───────────────────────────────────────────────────────────────
exten = t,1,Hangup()

; ─────────────────────────────────────────────────────────────────────────────
; [default] – catch-all for unauthenticated / anonymous calls
; ─────────────────────────────────────────────────────────────────────────────
[default]
exten = s,1,NoOp(Default context — rejecting)
 same  =  n,Hangup(21)

; ─────────────────────────────────────────────────────────────────────────────
; pjsip.conf  –  Asterisk PJSIP configuration for the call_and_record demo
;
; Two endpoints:
;   100  –  our sip_stack application  (UAC: registers, places outbound call)
;   101  –  Twinkle softphone          (or any soft/hard SIP phone)
;
; Topology:
;   sip_stack(100) → REGISTER → Asterisk
;   sip_stack(100) → INVITE 101 → Asterisk → INVITE → Twinkle(101)
;
; Replace ASTERISK_IP with the actual IP of your Asterisk server.
; ─────────────────────────────────────────────────────────────────────────────

; ── Transport ─────────────────────────────────────────────────────────────────
[transport-udp]
type      = transport
protocol  = udp
bind      = 0.0.0.0:5060     ; listen on all interfaces, port 5060
;bind     = 192.168.1.x:5060  ; bind to a specific IP if preferred

; ── Global / system options ───────────────────────────────────────────────────
[global]
type                  = global
max_forwards          = 70
user_agent            = Asterisk-demo

; ─────────────────────────────────────────────────────────────────────────────
; ENDPOINT 100  –  sip_stack application
; ─────────────────────────────────────────────────────────────────────────────
[100]
type            = endpoint
context         = demo          ; dialplan context in extensions.conf
disallow        = all
allow           = ulaw           ; G.711 μ-law  (PCMU, PT=0)
allow           = alaw           ; G.711 A-law  (PCMA, PT=8)
auth            = auth100
aors            = 100
;
; RTP/media settings
direct_media    = no             ; force media through Asterisk (safe default)
rtp_symmetric   = yes           ; handle NAT
force_rport     = yes
ice_support     = no
;
; For inbound calls FROM 100 we allow without strict auth check on transport
; (authentication is still enforced via the auth object below)
; identify_by: 'username' means match by Auth username on REGISTER.
; Add 'ip' as fallback so un-authenticated OPTIONS/INVITE still route correctly.
identify_by     = username,ip

[auth100]
type        = auth
auth_type   = userpass
username    = 100
password    = secret100         ; CHANGE THIS in production

[100]
type            = aor
max_contacts    = 2
remove_existing = yes
qualify_frequency = 30          ; OPTIONS keepalive every 30 s

; ─────────────────────────────────────────────────────────────────────────────
; ENDPOINT 101  –  Twinkle softphone (or any SIP phone)
; ─────────────────────────────────────────────────────────────────────────────
[101]
type            = endpoint
context         = demo
disallow        = all
allow           = ulaw
allow           = alaw
auth            = auth101
aors            = 101
direct_media    = no
rtp_symmetric   = yes
force_rport     = yes
ice_support     = no
identify_by     = username,ip

[auth101]
type        = auth
auth_type   = userpass
username    = 101
password    = secret101         ; CHANGE THIS — configure same in Twinkle

[101]
type            = aor
max_contacts    = 2
remove_existing = yes
qualify_frequency = 30

; ─────────────────────────────────────────────────────────────────────────────
; Outbound registration (optional — only needed if Asterisk itself registers
; to an upstream provider.  Not required for this demo.)
; ─────────────────────────────────────────────────────────────────────────────
; [reg-upstream]
; type       = registration
; server_uri = sip:provider.example.com
; client_uri = sip:myaccount@provider.example.com
; outbound_auth = auth-upstream
; retry_interval = 60

; ─────────────────────────────────────────────────────────────────────────────
; Twinkle account configuration hints (Settings → SIP account):
;
;   User:            101
;   Domain:          <ASTERISK_IP>
;   Auth name:       101
;   Password:        secret101
;   Registrar:       <ASTERISK_IP>:5060
;   Outbound proxy:  (leave empty)
;   Transport:       UDP
;   DTMF:            RFC 2833 / RFC 4733  (telephone-event)
;   Codecs:          ulaw / alaw  (disable all others for simplicity)
; ─────────────────────────────────────────────────────────────────────────────
